name: helldivers_wiki
description: 绝地潜兵2中文Wiki阅读器 - Helldivers 2 Chinese Wiki Reader
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_html: ^3.0.0
  cached_network_image: ^3.4.1
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  provider: ^6.1.2
  url_launcher: ^6.2.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

# flutter_html 3.0.0 依赖 package:html 顶层 matches()，html 0.15.7 已删除该函数，
# 固定 0.15.6（同时兼容锁定的 csslib 1.0.2）。
dependency_overrides:
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
